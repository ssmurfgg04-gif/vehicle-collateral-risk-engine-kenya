# Docker Compose for Kenya Vehicle Collateral Risk Engine
# Self-hosted Forgejo + Neo4j + Redis + App + Go Scraper + Python Pipeline

version: "3.9"

services:
  # ─── Forgejo (Self-Hosted Git) ────────────────────────────────────────
  # Replaces GitHub for Kenyan fintech compliance (CLOUD Act risk)
  # ODPC Registration: data stays in Kenya
  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=git.riskengine.co.ke
      - FORGEJO__server__ROOT_URL=https://git.riskengine.co.ke/
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__SECRET_KEY=${FORGEJO_SECRET_KEY:-change-me-in-production}
    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"   # Web UI
      - "2222:22"     # SSH
    networks:
      - riskengine

  # ─── Neo4j (Graph Database + GDS + APOC) ─────────────────────────────
  neo4j:
    image: neo4j:5-enterprise
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/riskengine2026
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_server_bolt_advertised__address=0.0.0.0:7687
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    networks:
      - riskengine
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p riskengine2026 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Cache + Session Store) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - riskengine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ─── Next.js App ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: riskengine-app
    restart: unless-stopped
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=riskengine2026
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=file:/data/custom.db
      - NODE_ENV=production
    volumes:
      - app-data:/data
    ports:
      - "3001:3000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - riskengine

  # ─── Go Scraper Fleet (10,000+ sites) ────────────────────────────────
  # This is the scale layer — Go handles 10K sites on one core
  scraper-go:
    build:
      context: .
      dockerfile: Dockerfile.go-scraper
    container_name: riskengine-scraper
    restart: unless-stopped
    environment:
      - QUEUE_DB_PATH=/data/ingestion_queue.db
      - BRIGHT_DATA_USERNAME=${BRIGHT_DATA_USERNAME:-}
      - BRIGHT_DATA_PASSWORD=${BRIGHT_DATA_PASSWORD:-}
      - SCRAPER_CONCURRENCY=1000
      - SCRAPER_SOURCES=family_bank,equity_bank,kenya_gazette
    volumes:
      - scraper-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - riskengine

  # ─── Python Pipeline Worker (Splink + Neo4j Ingestion) ───────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: riskengine-pipeline
    restart: unless-stopped
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=riskengine2026
      - QUEUE_DB_PATH=/data/ingestion_queue.db
      - PIPELINE_INTERVAL=300  # Run every 5 minutes
    volumes:
      - scraper-data:/data  # Shared with Go scraper
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - riskengine

volumes:
  forgejo-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
  app-data:
  scraper-data:

networks:
  riskengine:
    driver: bridge
